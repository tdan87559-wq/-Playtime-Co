<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>דמויות מ-Poppy Playtime</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
      background: #090a0f;
      color: #f1f5f9;
    }

    body {
      margin: 0;
      padding: 24px;
      text-align: center;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      color: #38bdf8;
      font-size: clamp(2rem, 5vw, 3rem);
      text-shadow: 0 0 15px #3b82f6;
    }

    .characters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 18px;
      margin-top: 28px;
    }

    .character {
      overflow: hidden;
      padding: 14px;
      border: 1px solid #374151;
      border-top: 4px solid #38bdf8;
      border-radius: 12px;
      background: #111827;
    }

    .character img {
      display: block;
      width: 100%;
      height: 240px;
      border-radius: 8px;
      background: #020617;
      object-fit: contain;
    }

    .character h2 {
      margin: 14px 0 4px;
      color: #facc15;
      font-size: 1.2rem;
    }

    .home-link {
      display: inline-block;
      margin-top: 26px;
      color: #7dd3fc;
    }
  </style>
</head>
<body>
  <main>
    <h1>דמויות מ-Poppy Playtime</h1>
    <p>גלריית דמויות מהמפעל של Playtime Co.</p>

    <section class="characters" aria-label="דמויות">
      <article class="character">
        <img src="images/huggy-wuggy.jpg" alt="האגי וואגי">
        <h2>האגי וואגי</h2>
      </article>

      <article class="character">
        <img src="images/mommy-long-legs.jpg" alt="מאמי לונג לגס">
        <h2>מאמי לונג לגס</h2>
      </article>

      <article class="character">
        <img src="images/catnap.jpg" alt="קאטנאפ">
        <h2>קאטנאפ</h2>
      </article>

      <article class="character">
        <img src="images/doey.jpg" alt="דואי">
        <h2>דואי</h2>
      </article>

      <article class="character">
        <img src="images/lily.jpg" alt="לילי">
        <h2>לילי</h2>
      </article>
    </section>

    <a class="home-link" href="index.html">חזרה לארכיון הראשי</a>
  </main>
</body>
</html>
